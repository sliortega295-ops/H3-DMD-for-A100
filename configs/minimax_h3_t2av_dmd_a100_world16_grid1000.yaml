# Approximation branch: same world16 H3 DMD workload, except the random DMD
# renoise base sigma is uniformly sampled from a frozen 1000-point grid and all
# AdaLN modulation comes from the corresponding cold-start mmap table.
model:
  name: minimax_h3_t2av_a100
  pretrained_model_name_or_path: ${oc.env:MINIMAX_H3_MODEL_PATH,/models/MiniMax-H3}
  running_dtype: bf16
  transformer_param_dtype: bf16
  local_files_only: true
  fsdp_load_on_cpu: true
  patch_size: [1, 2, 2]
  video_latent_channels: 24
  audio_latent_channels: 32
  vae_spatial_scale_factor: 16
  attention_backend: ${oc.env:H3_ATTN_BACKEND,_flash_3_hub}

distributed:
  backend: nccl
  timeout_minutes: 120
  sequence_parallel:
    enabled: false
    size: 1
  hybrid_shard:
    enabled: false
  fsdp2:
    enabled: true
    size: 16
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: null
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false

data:
  train:
    name: latent_dataset
    data_path: ${oc.env:H3_PROMPT_CACHE,/datasets/minimax_h3_prompt_cache}
    batch_size: 1
    num_workers: 2
    pin_memory: true
    shuffle: true
    drop_last: true

scheduler:
  num_train_timesteps: 1000
  timestep_distribution: uniform
  min_t: 0.001
  max_t: 1.0

training:
  method: minimax_h3_t2av_dmd_a100
  seed: ${oc.decode:${oc.env:H3_BENCHMARK_SEED,20260817}}
  max_train_iters: ${oc.decode:${oc.env:H3_MAX_ITERS,1}}
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_iters: 0
  save_every_iters: ${oc.decode:${oc.env:H3_SAVE_EVERY,0}}
  save_total_limit: 3
  minimax_h3:
    video_flow_shift: 6.0
    audio_flow_shift: 3.0
    video_loss_weight: 1.0
    audio_loss_weight: 1.0
    latent_dtype: fp32
  a100:
    matched_compute:
      enabled: true
      fixed_end_step_idx: 3
      expected_world_size: 16
      require_unique_samples: true
    activation_checkpointing:
      segment_size: 1
    activation_policy:
      name: checkpoint_boundary_cpu
      pin_memory: true
      detailed_events: false
    # The ordinary dynamic AdaLN projection cache is replaced by the mmap
    # Grid-1000 controller on this branch.
    adaln_cache:
      enabled: true
      max_dynamic_keys: 2
    adaln_grid:
      enabled: true
      grid_size: 1000
      manifest: ${oc.env:H3_ADALN_GRID_MANIFEST,}
      pin_memory: true
    block_pointwise_fusion:
      # Opt-in candidate. Baseline remains byte-for-byte on the upstream block
      # forward unless H3_FUSED_BLOCK_POINTWISE=1 is explicitly exported.
      enabled: false
    rotary_fusion:
      # Opt-in no-grad-only kernel. Grad forward and checkpoint replay remain
      # on the pinned Diffusers implementation.
      enabled: false
    critic_rollout_reorder:
      enabled: true
      group_size: 5
  dmd:
    num_inference_steps: 4
    fake_update_ratio: 5
    height: 768
    width: 1344
    num_frames: 124
    renoise_sigma_min: 0.02
    renoise_sigma_max: 0.98
    warp_denoising_step: false
  student:
    train_type: lora
    lora:
      rank: 128
      alpha: 128
      target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
    optimizer:
      learning_rate: 0.0001
      adam_beta1: 0.9
      adam_beta2: 0.999
      weight_decay: 0.01
      adam_epsilon: 0.00000001
  fake:
    train_type: lora
    lora:
      rank: 128
      alpha: 128
      target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
    optimizer:
      learning_rate: 0.00002
      adam_beta1: 0.9
      adam_beta2: 0.999
      weight_decay: 0.01
      adam_epsilon: 0.00000001
  teacher:
    guidance_scale: 1.0
    cfg_norm: none
  output_dir: ${oc.env:H3_OUTPUT_DIR,./output_train/minimax_h3_a100_grid1000}

inference:
  method: none
  infer_every_iters: null

logging:
  rank_zero_only: true
  train_log_every_iters: 1

resume:
  auto_resume: false
