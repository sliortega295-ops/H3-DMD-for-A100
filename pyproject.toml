[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-dmd-for-a100"
version = "0.1.0"
description = "Shared-backbone and AdaLN-cached MiniMax-H3 DMD overlay for LightX2V"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "H3-DMD-for-A100 contributors"}]

[tool.setuptools]
packages = ["h3_a100"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
